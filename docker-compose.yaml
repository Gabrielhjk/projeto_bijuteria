name: prod

services:
  app:
    build: .
    container_name: backend_biju
    ports:
      - "8000:8000"
    volumes:
      - ./src:/bijuteria/src
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: postgres_bijuteria
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_bijuteria
    env_file:
      - .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: